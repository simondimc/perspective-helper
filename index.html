<!doctype html>
<html lang="sl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Perspective helper</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1b1d; font-family: system-ui, sans-serif; }
      #app { position: fixed; inset: 0 0 var(--dock-h, 0px) 0; }
      @media (min-width: 700px) { body.sb-open #app { right: 272px; } }
      #app canvas { position: absolute; touch-action: none; display: block; }
      #overlay { pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="ui"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
